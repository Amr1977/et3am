name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android

      - name: Sync web assets to Android
        working-directory: frontend
        run: npx cap sync android

      - name: Grant Gradle executable permission
        run: chmod +x frontend/android/gradlew

      - name: Build release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: et3am-android
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Electron app
        working-directory: frontend
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: et3am-electron-${{ matrix.os }}
          path: frontend/dist-electron/*
          if-no-files-found: warn

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [android, electron]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          MAJOR=$(grep '^MAJOR=' VERSION | cut -d= -f2)
          MINOR=$(grep '^MINOR=' VERSION | cut -d= -f2)
          PATCH=$(grep '^PATCH=' VERSION | cut -d= -f2)
          echo "tag=v${MAJOR:-1}.${MINOR:-0}.${PATCH:-0}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Rename artifacts for release
        run: |
          mkdir -p release-files
          cp et3am-android/app-release.apk release-files/et3am-android.apk 2>/dev/null || true
          find et3am-electron-ubuntu-latest -name '*.AppImage' -exec cp {} release-files/et3am-electron-linux.AppImage \;
          find et3am-electron-windows-latest -name '*.exe' -exec cp {} release-files/et3am-electron-windows.exe \;
          find et3am-electron-macos-latest -name '*.dmg' -exec cp {} release-files/et3am-electron-macos.dmg \;

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          removeArtifacts: true
          tag: latest
          name: ET3AM ${{ steps.version.outputs.tag }}
          body: |
            ## ET3AM ${{ steps.version.outputs.tag }}

            ### 📱 Android
            - `et3am-android.apk` — Capacitor APK

            ### 🪟 Windows
            - `et3am-electron-windows.exe` — Electron NSIS installer

            ### 🍎 macOS
            - `et3am-electron-macos.dmg` — Electron DMG

            ### 🐧 Linux
            - `et3am-electron-linux.AppImage` — Electron AppImage

            > Built automatically via GitHub Actions
          artifacts: release-files/*
          token: ${{ secrets.GITHUB_TOKEN }}
