    <!-- Primary Meta Tags -->

    <meta name="theme-color" content="#2D6A4F" />

    <meta property="og:title" content="إطعام Et3am - Food Donation Platform" />

    <meta property="og:image:height" content="630" />

    <meta property="og:site_name" content="Et3am" />

    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://et3am.com/" />
    <meta name="twitter:title" content="إطعام Et3am - Food Donation Platform" />
    <meta name="twitter:description" content="Share surplus food with those in need. A charitable platform connecting donors to recipients." />
    <meta name="twitter:image" content="https://et3am.com/et3am-og.png?v=4" />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://et3am.com/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/defaulticon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "إطعام Et3am",
      "alternateName": "Et3am",
      "url": "https://et3am.com/",
      "logo": "https://et3am.com/et3am-og.png",
      "description": "Charitable platform connecting surplus food donors with recipients in need worldwide.",
      "sameAs": [
        "https://facebook.com/et3am",
        "https://twitter.com/et3am"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+20-1094450141",
        "contactType": "customer service",
        "availableLanguage": ["Arabic", "English"]
      },
      "serviceType": "Food Donation",
      "foundingLocation": {
        "@type": "Place",
        "name": "Alexandria, Egypt"
      },
      "serviceArea": {
        "@type": "AdministrativeArea",
        "name": "Global"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "إطعام Et3am",
      "url": "https://et3am.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://et3am.com/donations?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
